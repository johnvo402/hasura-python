[tool.poetry]
name = "hasura-python"
version = "0.1.0"
description = "Hasura backend handler for auth, actions, events, schedules"
authors = ["John Vo thanhthu040202@gmail.com"]
readme = "README.md"
packages = [{ include = "webhook", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.30" }
pydantic = { extras = ["dotenv"], version = "^2.8" }
aiohttp = "^3.10"
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
requests = "^2.32"
python-jose = { extras = ["cryptography"], version = "^3.3" }
passlib = { extras = ["bcrypt"], version = "^1.7" }
python-dotenv = "^1.0"
apscheduler = "^3.10"
pyjwt = "^2.10.1"
pydantic-settings = "^2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
httpx = "^0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
