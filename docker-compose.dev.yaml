services:
  database:
    platform: linux/amd64
    ports:
      - "10432:5432"
    volumes:
      - ./.pgdump:/backup:ro

  hasura:
    ports:
      - "8080:8080"
    environment:
      ## enable debugging mode. It is recommended to disable this in production
      HASURA_GRAPHQL_DEV_MODE: "true"

  webhook:
    image: python:3.12-slim
    command: >
      /bin/bash -c "
        apt-get update &&
        apt-get install -y curl build-essential &&
        curl -sSL https://install.python-poetry.org | POETRY_HOME=/opt/poetry python3 - &&
        export PATH=/opt/poetry/bin:/usr/local/bin:/usr/bin:/bin &&
        cd /app &&
        poetry install --no-root &&
        poetry run uvicorn src.webhook.main:app --reload --host 0.0.0.0 --port 8080
      "
    working_dir: /app
    volumes:
      - .:/app
    environment:
      LOG_LEVEL: debug
