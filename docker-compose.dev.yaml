services:
  postgres:
    platform: linux/amd64
    ports:
      - "10432:5432"
    volumes:
      - ./.pgdump:/backup:ro

  hasura:
    ports:
      - "8080:8080"
    environment:
      ## enable debugging mode. It is recommended to disable this in production
      HASURA_GRAPHQL_DEV_MODE: "true"

  webhook:
    image: python:3.12-slim
    command: "python /app/src/webhook/server.py"
    working_dir: /app
    volumes:
      - ./src/webhook:/app/src/webhook:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./poetry.lock:/app/poetry.lock:ro
    environment:
      LOG_LEVEL: debug
