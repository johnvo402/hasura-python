table:
  name: account
  schema: public
insert_permissions:
  - role: manager
    permission:
      check: {}
      columns:
        - id
        - is_active
        - email
        - full_name
        - password_hash
        - role
        - username
        - created_at
        - last_login_at
        - updated_at
    comment: ""
  - role: user
    permission:
      check: {}
      columns:
        - id
        - is_active
        - email
        - full_name
        - password_hash
        - role
        - username
        - created_at
        - last_login_at
        - updated_at
    comment: ""
select_permissions:
  - role: manager
    permission:
      columns:
        - id
        - is_active
        - email
        - full_name
        - password_hash
        - role
        - username
        - created_at
        - last_login_at
        - updated_at
      filter: {}
    comment: ""
  - role: user
    permission:
      columns:
        - id
        - is_active
        - email
        - full_name
        - password_hash
        - role
        - username
        - created_at
        - last_login_at
        - updated_at
      filter: {}
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - id
        - is_active
        - email
        - full_name
        - password_hash
        - role
        - username
        - created_at
        - last_login_at
        - updated_at
      filter: {}
      check: {}
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter: {}
    comment: ""
event_triggers:
  - name: create_account
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: '{{WEBHOOK_BASE_URL}}/event'
